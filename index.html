<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quizfree</title>
<meta name="description" content="Free flashcards with a learn mode, in a terminal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="term">
  <header class="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="title">quizfree</span></header>
  <main id="screen"></main>
  <div id="out" role="status"></div>
  <form id="cmd" autocomplete="off">
    <label for="cmd-input" id="prompt">guest@quizfree:~$</label>
    <input id="cmd-input" spellcheck="false" autocapitalize="off" placeholder="type 'help' — or press :">
  </form>
</div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
